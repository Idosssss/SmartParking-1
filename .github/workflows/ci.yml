name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: App (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  firmware-tests:
    name: Firmware tests (no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh hardware/tests/run.sh

  firmware-compile:
    name: Firmware compiles for the ESP32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 core and the LED library
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit NeoPixel"
      - run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default hardware/smart_parking
