<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Parking Lot: infrared sensors on an ESP32 report free spots, and the web app routes each driver to the nearest one. Technion IoT project." />
    <meta name="theme-color" content="#f2f6f7" />
    <title>Smart Parking Lot</title>
    <script>
      // Pick the colour theme before the first paint, so a dark-mode visitor never sees a white flash.
      try {
        var saved = localStorage.getItem('smartparking.theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
